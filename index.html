  color:var(--text); background:var(--bg);
  width:100%; max-width:480px; margin:0 auto; min-height:100vh;
  position:relative; -webkit-font-smoothing:antialiased;
}
.tf-root[data-theme="dark"]{
  --bg:#0F1216; --panel:#171B21; --panel-2:#1D222A; --border:#2A313B;
  --text:#E9EBEF; --text-2:#9AA3B0; --text-3:#6B7280;
  --accent:#E0762E; --accent-2:#F0895A;
}
.tf-root *{ box-sizing:border-box; }
.tf-loading{ padding:40px; text-align:center; color:var(--text-2); }
.tf-app{ padding:16px 16px 12px; min-height:100vh; }
.tf-app.has-nav{ padding-bottom:84px; }
.tf-screen{ display:flex; flex-direction:column; gap:4px; }

.tf-mono{ font-family:'IBM Plex Mono',monospace; }
.tf-truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Home */
.tf-home-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
.tf-greeting{ font-size:22px; font-weight:600; margin:0; letter-spacing:-0.02em; }
.tf-date{ font-size:13px; color:var(--text-2); margin:2px 0 0; }
.tf-fab-inline{ background:var(--accent); color:#fff; border:none; width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 10px rgba(200,106,46,0.3); }

.tf-summary-card{ background:linear-gradient(150deg,var(--panel-2),var(--panel)); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:18px; }
.tf-summary-top{ display:flex; align-items:baseline; gap:8px; margin-bottom:14px; }
.tf-summary-total{ font-size:36px; font-weight:700; letter-spacing:-0.03em; }
.tf-summary-label{ font-size:13px; color:var(--text-2); font-weight:500; }
.tf-summary-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.tf-stat{ display:flex; flex-direction:column; align-items:center; gap:2px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 4px; }
.tf-stat span{ font-size:15px; font-weight:700; }
.tf-stat small{ font-size:10px; color:var(--text-3); }

.tf-section{ margin:18px 0 6px; }
.tf-section-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.tf-section-head h3{ font-size:14px; font-weight:600; margin:0; color:var(--text); }
.tf-linklike{ background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer; padding:0; }

.tf-overdue-list{ display:flex; flex-direction:column; gap:2px; background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
.tf-overdue-row{ display:flex; align-items:center; gap:10px; padding:11px 12px; background:none; border:none; border-bottom:1px solid var(--border); width:100%; text-align:left; cursor:pointer; }
.tf-overdue-row:last-child{ border-bottom:none; }
.tf-overdue-info{ display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
.tf-overdue-title{ font-size:13.5px; font-weight:500; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tf-overdue-sub{ font-size:11.5px; color:var(--text-3); }

.tf-progress-overview{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; }
.tf-progress-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px; color:var(--text-2); }
.tf-progress-row > span{ width:78px; flex-shrink:0; }
.tf-progress-foot{ display:flex; justify-content:space-between; font-size:12px; color:var(--text-3); margin-top:4px; }

/* Screen head */
.tf-screen-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.tf-screen-head h2{ font-size:22px; font-weight:600; margin:0; letter-spacing:-0.02em; }

/* Search / tools */
.tf-searchbar{ display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:9px 12px; color:var(--text-3); margin-bottom:8px; }
.tf-searchbar input{ border:none; background:none; outline:none; flex:1; font-size:14px; color:var(--text); font-family:inherit; }
.tf-searchbar button{ background:none; border:none; color:var(--text-3); cursor:pointer; }
.tf-toolrow{ display:flex; gap:8px; margin-bottom:8px; }
.tf-toolbtn{ display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:7px 10px; font-size:12.5px; color:var(--text-2); cursor:pointer; font-family:inherit; }
.tf-toolbtn.is-active{ border-color:var(--accent); color:var(--accent); }
.tf-sortsel{ flex:1; appearance:none; }
.tf-filter-panel{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:10px; display:flex; flex-direction:column; gap:10px; }

/* Cards */
.tf-card-list{ display:flex; flex-direction:column; gap:10px; }
.tf-card{ background:var(--panel); border:1px solid var(--border); border-left:3px solid; border-radius:14px; display:flex; overflow:hidden; }
.tf-card-main{ flex:1; text-align:left; background:none; border:none; padding:12px 12px 12px 14px; cursor:pointer; font-family:inherit; color:inherit; min-width:0; }
.tf-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
.tf-card-title{ font-size:14.5px; font-weight:600; line-height:1.3; }
.tf-card-project{ font-size:12px; color:var(--text-3); margin-top:2px; }
.tf-card-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
.tf-badge{ font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:6px; text-transform:uppercase; letter-spacing:0.02em; }
.tf-due{ display:flex; align-items:center; gap:4px; font-size:11.5px; color:var(--text-3); }
.tf-due.is-overdue{ color:#E5484D; font-weight:600; }
.tf-due.is-today{ color:var(--accent); font-weight:600; }
.tf-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
.tf-tag{ font-size:10.5px; background:var(--panel-2); color:var(--text-2); padding:3px 7px; border-radius:6px; display:inline-flex; align-items:center; gap:4px; }
.tf-tag.is-removable button{ background:none; border:none; color:var(--text-3); cursor:pointer; display:flex; }
.tf-card-actions{ display:flex; flex-direction:column; border-left:1px solid var(--border); }
.tf-iconbtn{ background:none; border:none; color:var(--text-2); width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:8px; }
.tf-iconbtn:hover{ background:var(--panel-2); }
.tf-iconbtn.is-danger{ color:#E5484D; }
.tf-iconbtn.is-active{ color:var(--accent); }
.tf-card-actions .tf-iconbtn{ flex:1; border-radius:0; }

.tf-pdot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

/* Gauge */
.tf-gauge{ display:flex; align-items:center; gap:8px; margin-top:9px; }
.tf-gauge-track{ position:relative; flex:1; height:6px; background:var(--panel-2); border-radius:3px; overflow:visible; }
.tf-gauge-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:3px; transition:width .2s; }
.tf-gauge-tick{ position:absolute; top:-1px; width:1px; height:8px; background:var(--bg); }
.tf-gauge-val{ font-size:11px; font-weight:600; color:var(--text-2); width:32px; text-align:right; flex-shrink:0; }

/* Empty */
.tf-empty{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:36px 16px; color:var(--text-3); text-align:center; }
.tf-empty-title{ font-size:13.5px; font-weight:600; color:var(--text-2); margin:4px 0 0; }
.tf-empty-hint{ font-size:12px; margin:0; }

/* Forms */
.tf-form-wrap, .tf-detail{ display:flex; flex-direction:column; min-height:100vh; margin:-16px; }
.tf-form-header{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); background:var(--bg); position:sticky; top:0; z-index:5; }
.tf-form-headtitle{ font-size:15px; font-weight:600; flex:1; text-align:center; }
.tf-form-body{ padding:16px; display:flex; flex-direction:column; gap:14px; padding-bottom:60px; }
.tf-field{ display:flex; flex-direction:column; gap:6px; }
.tf-field-row{ display:flex; gap:10px; }
.tf-field-row .tf-field{ flex:1; min-width:0; }
.tf-label{ font-size:11.5px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:0.03em; }
.tf-input, .tf-textarea{ background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; color:var(--text); font-family:inherit; outline:none; width:100%; }
.tf-input:focus, .tf-textarea:focus{ border-color:var(--accent); }
.tf-textarea{ resize:vertical; }
.tf-slider{ width:100%; accent-color:var(--accent); }
.tf-chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
.tf-chip{ font-size:12px; padding:6px 11px; border-radius:20px; border:1px solid var(--border); background:var(--panel); color:var(--text-2); cursor:pointer; font-family:inherit; }
.tf-chip.is-selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
.tf-tag-editor{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; border:1px solid var(--border); border-radius:10px; padding:8px 10px; background:var(--panel); }
.tf-tag-input{ border:none; outline:none; background:none; font-size:13px; flex:1; min-width:80px; color:var(--text); font-family:inherit; }
.tf-section-divider{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:0.03em; margin-top:6px; padding-top:14px; border-top:1px solid var(--border); }
.tf-attach-note{ display:flex; gap:6px; align-items:flex-start; font-size:11.5px; color:var(--text-3); background:var(--panel-2); padding:9px 10px; border-radius:10px; }
.tf-linklike{ text-align:left; }

/* Buttons */
.tf-btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid transparent; font-family:inherit; }
.tf-btn-primary{ background:var(--accent); color:#fff; }
.tf-btn-primary:disabled{ opacity:0.4; cursor:default; }
.tf-btn-ghost{ background:var(--panel); border-color:var(--border); color:var(--text-2); }
.tf-btn-danger{ background:#E5484D; color:#fff; }
.tf-btn-danger-outline{ background:none; border-color:#E5484D; color:#E5484D; }
.tf-btn-sm{ padding:7px 12px; font-size:12.5px; }

/* Detail */
.tf-detail-body{ padding:16px; padding-bottom:60px; }
.tf-detail-title{ font-size:19px; font-weight:700; margin:6px 0 2px; letter-spacing:-0.01em; }
.tf-detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 10px; margin-top:14px; }
.tf-detail-grid p{ margin:2px 0 0; font-size:13.5px; font-weight:500; }
.tf-detail-section{ margin-top:18px; }
.tf-detail-text{ font-size:13.5px; color:var(--text-2); line-height:1.5; margin:4px 0 0; white-space:pre-wrap; }
.tf-doc-box{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; }
.tf-doc-num{ font-size:13px; margin:4px 0 0; }
.tf-overdue-text{ color:#E5484D; }
.tf-activity-list{ display:flex; flex-direction:column; gap:10px; margin-top:8px; border-left:2px solid var(--border); padding-left:12px; }
.tf-activity-item{ display:flex; flex-direction:column; gap:2px; }
.tf-activity-time{ font-size:10.5px; color:var(--text-3); }
.tf-activity-text{ font-size:13px; color:var(--text-2); }
.tf-detail-buttons{ display:flex; flex-direction:column; gap:10px; margin-top:24px; }

/* Projects */
.tf-project-list{ display:flex; flex-direction:column; gap:10px; }
.tf-project-card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; text-align:left; cursor:pointer; font-family:inherit; color:inherit; }
.tf-project-top{ display:flex; flex-direction:column; margin-bottom:8px; }
.tf-project-code{ font-size:11px; font-weight:700; color:var(--accent); letter-spacing:0.03em; }
.tf-project-name{ font-size:14.5px; font-weight:600; margin-top:1px; }
.tf-project-stats{ display:flex; gap:12px; margin-top:8px; font-size:11.5px; color:var(--text-3); flex-wrap:wrap; }
.tf-manage-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border); }
.tf-manage-name{ font-size:13.5px; font-weight:600; margin:0; }
.tf-manage-sub{ font-size:11.5px; color:var(--text-3); margin:2px 0 0; }

/* Calendar */
.tf-cal-nav{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.tf-cal-month{ flex:1; font-size:14.5px; font-weight:600; text-align:center; }
.tf-cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:10px; }
.tf-cal-dow{ text-align:center; font-size:10.5px; color:var(--text-3); font-weight:600; padding-bottom:4px; }
.tf-cal-cell{ position:relative; aspect-ratio:1; border:none; background:none; border-radius:9px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:inherit; color:var(--text); font-size:12.5px; }
.tf-cal-cell.is-empty{ cursor:default; }
.tf-cal-cell.is-today{ font-weight:700; color:var(--accent); }
.tf-cal-cell.is-selected{ background:var(--accent); color:#fff; }
.tf-cal-daynum{ z-index:1; }
.tf-cal-dot{ position:absolute; bottom:3px; font-size:8px; background:var(--text-3); color:#fff; min-width:13px; height:13px; border-radius:7px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
.tf-cal-cell.is-selected .tf-cal-dot{ background:rgba(255,255,255,0.35); }
.tf-cal-dot.is-overdue{ background:#E5484D; }

/* My Day extra */
.tf-mydayadd-list{ display:flex; flex-direction:column; gap:2px; background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-top:6px; }

/* Analytics bars */
.tf-barlist{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
.tf-barrow{ display:flex; align-items:center; gap:8px; }
.tf-barlabel{ font-size:11.5px; color:var(--text-2); width:92px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tf-bartrack{ flex:1; height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden; }
.tf-barfill{ height:100%; border-radius:4px; }
.tf-barval{ font-size:11.5px; font-weight:600; width:20px; text-align:right; }

/* More / settings */
.tf-menu-group{ background:var(--panel); border:1px solid var(--border); border-radius:14px; margin-bottom:14px; overflow:hidden; }
.tf-menu-heading{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-3); padding:12px 14px 6px; margin:0; }
.tf-menu-row{ display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; border-bottom:1px solid var(--border); padding:13px 14px; font-size:13.5px; color:var(--text); cursor:pointer; font-family:inherit; }
.tf-menu-row:last-child{ border-bottom:none; }
.tf-menu-row span{ flex:1; text-align:left; }
.tf-menu-chev{ color:var(--text-3); }
.tf-theme-row{ display:flex; gap:8px; padding:0 14px 14px; }
.tf-theme-opt{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2); color:var(--text-2); font-size:12.5px; cursor:pointer; font-family:inherit; }
.tf-theme-opt.is-selected{ background:var(--accent); border-color:var(--accent); color:#fff; }
.tf-footnote{ font-size:11.5px; color:var(--text-3); text-align:center; margin-top:6px; padding:0 20px; }

/* Bottom nav */
.tf-bottomnav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background:var(--panel); border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:10; }
.tf-navitem{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--text-3); cursor:pointer; padding:4px; font-family:inherit; }
.tf-navitem span{ font-size:10px; font-weight:500; }
.tf-navitem.is-active{ color:var(--accent); }

/* Modal */
.tf-modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.tf-confirm{ background:var(--panel); border-radius:16px; padding:20px; width:100%; max-width:320px; }
.tf-confirm-title{ font-size:15px; font-weight:700; margin:0 0 6px; }
.tf-confirm-msg{ font-size:13px; color:var(--text-2); margin:0 0 16px; }
.tf-confirm-actions{ display:flex; gap:10px; justify-content:flex-end; }

.tf-print-modal{ background:#fff; color:#111; border-radius:12px; width:100%; max-width:460px; max-height:85vh; overflow:auto; }
.tf-print-toolbar{ display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #eee; position:sticky; top:0; background:#fff; }
.tf-print-area{ padding:20px; font-family:'IBM Plex Sans',sans-serif; }
.tf-print-area h1{ font-size:20px; margin:0 0 4px; }
.tf-print-meta{ font-size:11px; color:#666; margin:0 0 14px; }
.tf-print-summary{ display:flex; flex-wrap:wrap; gap:12px; font-size:12px; margin-bottom:18px; font-weight:600; }
.tf-print-project{ margin-bottom:20px; }
.tf-print-project h2{ font-size:14px; margin:0 0 8px; }
.tf-print-project table{ width:100%; border-collapse:collapse; font-size:11px; }
.tf-print-project th, .tf-print-project td{ border:1px solid #ddd; padding:5px 6px; text-align:left; }
@media print{ .tf-print-toolbar{ display:none; } }

/* Timesheet */
.tf-timer-banner{ display:flex; align-items:center; justify-content:space-between; background:linear-gradient(120deg,var(--accent),var(--accent-2)); color:#fff; padding:12px 16px; position:sticky; top:53px; z-index:4; }
.tf-timer-info{ display:flex; flex-direction:column; }
.tf-timer-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; opacity:0.85; }
.tf-timer-clock{ font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }
.tf-timer-start{ width:100%; margin-top:12px; justify-content:center; }
.tf-timer-start:disabled{ opacity:0.5; }

.tf-timesheet-card{ display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; cursor:pointer; font-family:inherit; color:inherit; }
.tf-timesheet-card-top{ display:flex; justify-content:space-between; align-items:baseline; font-size:14px; font-weight:700; }
.tf-timesheet-card-foot{ display:flex; justify-content:space-between; gap:8px; margin-top:10px; font-size:11.5px; color:var(--text-3); align-items:center; }
.tf-balance-pos{ color:#3FB950; }
.tf-balance-neg{ color:#E5484D; }

.tf-clock-row{ display:flex; gap:10px; }
.tf-clock-input{ display:flex; gap:6px; align-items:center; }
.tf-clock-input .tf-input{ flex:1; }
.tf-clock-input .tf-iconbtn{ background:var(--panel-2); flex-shrink:0; }

.tf-duration-readout{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-2); background:var(--panel-2); padding:8px 10px; border-radius:10px; }

.tf-worklog-card{ display:flex; align-items:stretch; background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
.tf-worklog-time{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; padding:10px 12px; font-size:11.5px; font-weight:600; color:var(--text-2); background:var(--panel-2); flex-shrink:0; min-width:58px; font-variant-numeric:tabular-nums; }
.tf-worklog-dash{ color:var(--text-3); font-size:9px; }
.tf-worklog-main{ flex:1; padding:10px 12px; min-width:0; }
.tf-worklog-title{ font-size:13.5px; font-weight:600; margin:0; }
.tf-worklog-meta{ display:flex; gap:8px; flex-wrap:wrap; font-size:11px; color:var(--text-3); margin-top:4px; }
.tf-worklog-actions{ display:flex; flex-direction:column; border-left:1px solid var(--border); }
.tf-worklog-actions .tf-iconbtn{ flex:1; border-radius:0; }

.tf-lock-banner{ display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:10px 12px; margin-top:10px; font-size:12.5px; font-weight:600; }
.tf-lock-banner span{ flex:1; }

.tf-weekind{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:11px; color:var(--text-3); }
.tf-weekind-complete{ background:rgba(63,185,80,0.15); color:#3FB950; }
.tf-weekind-below{ background:rgba(229,72,77,0.15); color:#E5484D; }
.tf-weekind-above{ background:rgba(76,154,255,0.15); color:#4C9AFF; }
.tf-weekind-off{ background:var(--panel-2); }
.tf-weekind-none{ background:var(--panel-2); }

.tf-ts-mark{ position:absolute; bottom:3px; font-size:9px; font-weight:700; }
.tf-ts-mark.is-done{ color:#3FB950; }
